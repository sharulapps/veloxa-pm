<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELOXA — Sign In</title>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;min-height:100vh;background:radial-gradient(ellipse at 30% 50%,#0f1e3d 0%,#0d1526 60%,#060d1a 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.25;pointer-events:none}
.b1{width:500px;height:500px;background:#1a3a7a;top:-150px;left:-150px}
.b2{width:400px;height:400px;background:#0f2d5c;bottom:-100px;right:-100px}
.b3{width:250px;height:250px;background:#1e4080;top:40%;left:55%}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:40px;width:100%;max-width:400px;position:relative;z-index:1;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.logo-wrap{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:28px}
.logo-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:28px;letter-spacing:3px;color:#fff}
.card-title{font-family:'Rajdhani',sans-serif;font-size:24px;font-weight:700;letter-spacing:1px;text-align:center;color:rgba(255,255,255,0.9);margin-bottom:4px}
.card-sub{text-align:center;color:rgba(255,255,255,0.35);font-size:13px;margin-bottom:28px}
.field{margin-bottom:16px}
.label{font-size:11px;font-weight:600;color:rgba(255,255,255,0.45);letter-spacing:0.5px;text-transform:uppercase;display:block;margin-bottom:6px}
.input{width:100%;padding:11px 14px;border:1px solid rgba(255,255,255,0.1);border-radius:10px;font-size:14px;font-family:'Inter',sans-serif;color:rgba(255,255,255,0.85);outline:none;background:rgba(255,255,255,0.06);transition:all 0.2s}
.input:focus{border-color:rgba(37,99,235,0.6);background:rgba(255,255,255,0.09);box-shadow:0 0 0 3px rgba(37,99,235,0.15)}
.input::placeholder{color:rgba(255,255,255,0.2)}
.btn-main{width:100%;padding:12px;background:linear-gradient(135deg,#1a56db,#2563eb);border:none;border-radius:10px;color:white;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin-top:8px;box-shadow:0 4px 14px rgba(26,86,219,0.35);transition:all 0.2s}
.btn-main:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(26,86,219,0.45)}
.btn-main:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:rgba(255,255,255,0.2);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08)}
.btn-google{width:100%;padding:11px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:rgba(255,255,255,0.7);font-size:13px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s}
.btn-google:hover{border-color:rgba(37,99,235,0.5);background:rgba(37,99,235,0.1)}
.forgot-link{text-align:right;margin-top:6px}
.forgot-link a{font-size:12px;color:rgba(255,255,255,0.35);cursor:pointer;text-decoration:none;transition:color 0.15s}
.forgot-link a:hover{color:#60a5fa}
.footer-text{text-align:center;margin-top:22px;font-size:12px;color:rgba(255,255,255,0.25)}
.error-box{background:rgba(220,38,38,0.12);border:1px solid rgba(220,38,38,0.25);color:#f87171;border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:14px;display:none}
.success-box{background:rgba(5,150,105,0.12);border:1px solid rgba(5,150,105,0.25);color:#34d399;border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:14px;display:none}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
/* Reset modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.modal-bg.open{display:flex}
.modal{background:#0f1e3d;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:32px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.modal-title{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:#fff;margin-bottom:6px}
.modal-sub{font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:20px;line-height:1.5}
.modal-footer{display:flex;gap:8px;margin-top:16px}
.btn-sec{flex:1;padding:10px;background:transparent;border:1px solid rgba(255,255,255,0.1);border-radius:9px;color:rgba(255,255,255,0.5);font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif}
.btn-sec:hover{background:rgba(255,255,255,0.05)}
.btn-pri{flex:1;padding:10px;background:linear-gradient(135deg,#1a56db,#2563eb);border:none;border-radius:9px;color:white;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
/* ===== MOBILE ===== */
@media (max-width: 480px) {
  body{padding:16px;overflow-x:hidden;overflow-y:auto}
  .card{padding:28px 20px}
  input{font-size:16px!important}
}
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="card">
  <div class="logo-wrap">
    <svg width="46" height="46" viewBox="0 0 100 100" fill="none">
      <defs>
        <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f1e3d"/><stop offset="100%" stop-color="#0a1628"/></linearGradient>
        <linearGradient id="il" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a3a7a"/><stop offset="100%" stop-color="#1a56db"/></linearGradient>
        <linearGradient id="ir" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
      </defs>
      <rect width="100" height="100" rx="22" fill="url(#ibg)"/>
      <path d="M15,15 L36,15 L50,68 L40,68 Z" fill="url(#il)"/>
      <path d="M85,15 L64,15 L50,68 L60,68 Z" fill="url(#ir)"/>
      <path d="M44,15 L56,15 L52,34 L48,34 Z" fill="url(#ibg)" opacity="0.9"/>
      <path d="M52,15 L60,15 L54,30 Z" fill="#93c5fd" opacity="0.5"/>
    </svg>
    <span class="logo-name">VELOXA</span>
  </div>

  <div class="card-title">Welcome</div>
  <div class="card-sub">Sign in to access your workspace</div>

  <div class="error-box" id="err-box"></div>
  <div class="success-box" id="ok-box"></div>

  <div class="field">
    <label class="label">Email</label>
    <input class="input" type="email" id="email" placeholder="name@company.com" autocomplete="email">
  </div>
  <div class="field">
    <label class="label">Password</label>
    <input class="input" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    <div class="forgot-link"><a onclick="openReset()">Forgot password?</a></div>
  </div>

  <button class="btn-main" id="login-btn" onclick="doLogin()">Sign In</button>

  <div class="divider">or</div>
  <button class="btn-google" onclick="doGoogle()">
    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Continue with Google
  </button>

  <div class="footer-text">© 2026 VELOXA · <span id="company-name"></span></div>
</div>

<!-- Reset Password Modal -->
<div class="modal-bg" id="reset-modal">
  <div class="modal">
    <div class="modal-title">🔑 Reset Password</div>
    <div class="modal-sub">Enter your email. We will send a password reset link to your inbox.</div>
    <div class="error-box" id="reset-err" style="display:none"></div>
    <div class="success-box" id="reset-ok" style="display:none"></div>
    <label class="label" style="color:rgba(255,255,255,0.45);font-size:11px;display:block;margin-bottom:6px">Email</label>
    <input class="input" type="email" id="reset-email" placeholder="name@company.com">
    <div class="modal-footer">
      <button class="btn-sec" onclick="closeReset()">Cancel</button>
      <button class="btn-pri" id="reset-btn" onclick="doReset()">Send Link</button>
    </div>
  </div>
</div>

<script>
// Init Firebase
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db   = firebase.firestore();

// Set company name
document.getElementById('company-name').textContent = APP_CONFIG.companyName || '';

// Role routing
const EXEC_ROLES = ['ceo','director','gm'];
const ADMIN_ROLES = ['admin','superadmin'];

auth.onAuthStateChanged(async user => {
  if (!user) return;
  try {
    const doc = await db.collection('users').doc(user.uid).get();
    if (!doc.exists) { auth.signOut(); return; }
    const role = doc.data().role;
    if (EXEC_ROLES.includes(role))       window.location.href = 'exec.html';
    else if (ADMIN_ROLES.includes(role)) window.location.href = 'admin.html';
    else                                  window.location.href = 'app.html';
  } catch(e) { showErr(e.message); }
});

function setLoading(loading) {
  const btn = document.getElementById('login-btn');
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="spin"></span> Processing...' : 'Sign In';
}

function showErr(msg) {
  const el = document.getElementById('err-box');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('ok-box').style.display = 'none';
}
function showOk(msg) {
  const el = document.getElementById('ok-box');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('err-box').style.display = 'none';
}
function clearMsgs() {
  document.getElementById('err-box').style.display = 'none';
  document.getElementById('ok-box').style.display = 'none';
}

const ERR_MAP = {
  'auth/invalid-credential':    'Invalid email or password.',
  'auth/user-not-found':        'Account not found.',
  'auth/wrong-password':        'Incorrect password.',
  'auth/too-many-requests':     'Too many attempts. Please try again later.',
  'auth/invalid-email':         'Invalid email format.',
  'auth/network-request-failed':'Connection error. Check your internet.',
};

async function doLogin() {
  clearMsgs();
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('password').value;
  if (!email || !pass) { showErr('Please enter your email and password.'); return; }
  setLoading(true);
  try {
    await auth.signInWithEmailAndPassword(email, pass);
    // onAuthStateChanged will handle redirect
  } catch(e) {
    showErr(ERR_MAP[e.code] || e.message);
    setLoading(false);
  }
}

async function doGoogle() {
  clearMsgs();
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    const result = await auth.signInWithPopup(provider);
    const user = result.user;
    // Check if user exists in Firestore
    const doc = await db.collection('users').doc(user.uid).get();
    if (!doc.exists) {
      // Auto-create with basic role — admin can update later
      await db.collection('users').doc(user.uid).set({
        name: user.displayName || user.email,
        email: user.email,
        role: 'engineer',
        workspaceId: 'default',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        photoURL: user.photoURL || null
      });
    }
  } catch(e) {
    showErr(ERR_MAP[e.code] || e.message);
  }
}

// Reset Password
function openReset() {
  document.getElementById('reset-email').value = document.getElementById('email').value;
  document.getElementById('reset-err').style.display = 'none';
  document.getElementById('reset-ok').style.display = 'none';
  document.getElementById('reset-modal').classList.add('open');
}
function closeReset() { document.getElementById('reset-modal').classList.remove('open'); }

async function doReset() {
  const email = document.getElementById('reset-email').value.trim();
  if (!email) { showResetErr('Please enter your email.'); return; }
  const btn = document.getElementById('reset-btn');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    await auth.sendPasswordResetEmail(email, {
      url: window.location.href,
      handleCodeInApp: false
    });
    document.getElementById('reset-ok').textContent = '✅ Password reset email sent. Check your inbox.';
    document.getElementById('reset-ok').style.display = 'block';
    document.getElementById('reset-err').style.display = 'none';
    btn.textContent = 'Sent!';
    setTimeout(closeReset, 3000);
  } catch(e) {
    showResetErr(ERR_MAP[e.code] || e.message);
    btn.disabled = false; btn.textContent = 'Send Link';
  }
}
function showResetErr(msg) {
  document.getElementById('reset-err').textContent = msg;
  document.getElementById('reset-err').style.display = 'block';
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('reset-modal').classList.contains('open')) doReset();
    else doLogin();
  }
  if (e.key === 'Escape') closeReset();
});
</script>
</body>
</html>
